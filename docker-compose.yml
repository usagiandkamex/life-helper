# Local development with Docker: `docker compose up --build`, then open http://localhost:8000
# Run due automations once: `docker compose run --rm job`
services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      LH_ENVIRONMENT: development
      LH_BASE_URL: http://localhost:8000
    volumes:
      - ./.data:/data

  job:
    build: .
    profiles: ["job"]
    command: ["life-helper-job"]
    env_file: .env
    environment:
      LH_ENVIRONMENT: development
      LH_BASE_URL: http://localhost:8000
    volumes:
      - ./.data:/data
